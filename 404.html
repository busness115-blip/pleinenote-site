<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta property="og:title" content="Page introuvable - Pleine Note"><meta property="og:description" content="Mémoire technique pour marché public, prêt à déposer en 72 h et calé sur la grille de notation. Propreté, espaces verts, informatique. Pré-analyse offerte."><link rel="canonical" href="https://pleinenote.fr/"><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#17224A"><meta property="og:type" content="website"><meta property="og:url" content="https://pleinenote.fr/"><meta property="og:image" content="https://pleinenote.fr/image-partage.png"><meta property="og:locale" content="fr_FR"><meta name="twitter:card" content="summary_large_image"><title>Page introuvable - Pleine Note</title><meta name="description" content="Mémoire technique pour marché public, prêt à déposer en 72 h et calé sur la grille de notation. Propreté, espaces verts, informatique. Pré-analyse offerte."><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"><style>
/* Concept : une page de dossier de consultation bien tenue - règle graduée des 72 heures, tampon « prêt à déposer », texte en colonne étroite. */
:root{
  --papier:#F4F5F2; --surface:#FFFFFF; --encre:#17224A; --encre-douce:#4A5370; --filet:#D5D9E2;
  --tampon:#5B3CC4; --surligneur:#FFE36B; --sur-surligneur:#17224A;
  --f-titre:"Archivo","Arial Narrow",Arial,sans-serif; --f-texte:"Source Serif 4",Georgia,"Times New Roman",serif;
  --colonne:42rem; --large:68rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --papier:#10142A; --surface:#171C36; --encre:#E7E9F2; --encre-douce:#A4ABC3; --filet:#2C3354;
  --tampon:#A78DFF; --surligneur:#F1DA5A; --sur-surligneur:#17224A; color-scheme:dark}}
:root[data-theme="dark"]{
  --papier:#10142A; --surface:#171C36; --encre:#E7E9F2; --encre-douce:#A4ABC3; --filet:#2C3354;
  --tampon:#A78DFF; --surligneur:#F1DA5A; --sur-surligneur:#17224A; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papier);color:var(--encre);font:1.125rem/1.65 var(--f-texte);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit;text-decoration-color:var(--tampon);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--tampon);outline-offset:3px;border-radius:2px}
.cadre{max-width:var(--large);margin:0 auto}
h1,h2,h3{font-family:var(--f-titre);font-stretch:85%;line-height:1.08;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2.4rem,7vw,4.6rem);font-weight:750;max-width:14ch}
h2{font-size:clamp(1.7rem,4vw,2.5rem);font-weight:700;max-width:22ch}
h3{font-size:1.2rem;font-weight:700;font-stretch:90%}
p{margin:0;max-width:var(--colonne)}
.doux{color:var(--encre-douce)}
.entete{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:20px;border-bottom:1px solid var(--filet)}
.marque{font-family:var(--f-titre);font-weight:800;font-stretch:80%;font-size:1.35rem;text-decoration:none;letter-spacing:-.01em}
.marque span{color:var(--tampon)}
.surtitre{font-family:var(--f-titre);font-weight:700;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tampon);margin-bottom:14px}
.entete .tel{font-family:var(--f-titre);font-size:.95rem;font-stretch:90%;white-space:nowrap}
section{padding-block:clamp(48px,8vw,96px);border-bottom:1px solid var(--filet)}
section:last-of-type{border-bottom:0}
.pile{display:grid;gap:20px}
.hero{padding-block:clamp(40px,7vw,80px) 28px;border-bottom:0}
.hero .pile{gap:24px}
.lead{font-size:clamp(1.15rem,2.2vw,1.35rem);line-height:1.55}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.bouton{font-family:var(--f-titre);font-stretch:90%;font-weight:650;font-size:1.05rem;display:inline-flex;align-items:center;
  min-height:48px;padding:10px 20px;border-radius:4px;text-decoration:none;border:2px solid var(--encre)}
.bouton.plein{background:var(--encre);color:var(--papier)}
.bouton.plein:hover{background:var(--tampon);border-color:var(--tampon)}
.bouton.creux:hover{border-color:var(--tampon);color:var(--tampon)}

/* Règle graduée des 72 heures */
.regle{position:relative;margin-top:40px;padding-top:64px}
.echelle{position:relative;height:30px;border-bottom:2px solid var(--encre);
  background:
    repeating-linear-gradient(90deg,var(--encre) 0 2px,transparent 2px calc(100%/6)) bottom/100% 30px no-repeat,
    repeating-linear-gradient(90deg,var(--encre-douce) 0 1px,transparent 1px calc(100%/72)) bottom/100% 10px no-repeat}
.remplissage{position:absolute;left:0;bottom:-2px;height:6px;width:100%;background:var(--tampon);transform-origin:left;transform:scaleX(1)}
.jalons{list-style:none;margin:0;padding:0;position:relative;height:150px}
.jalons li{position:absolute;top:0;transform:translateX(-50%);width:9.5rem;padding-top:14px;text-align:center}
.jalons li::before{content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--surface);border:2px solid var(--encre)}
.jalons li:first-child{transform:none;text-align:left}.jalons li:first-child::before{left:0;margin-left:-5px}
.jalons li:last-child{transform:translateX(-100%);text-align:right}.jalons li:last-child::before{left:auto;right:-6px;margin:0}
.h{display:block;font-family:var(--f-titre);font-weight:800;font-stretch:110%;font-size:1.35rem;font-variant-numeric:tabular-nums}
.jalons small{display:block;font-size:.88rem;line-height:1.35;color:var(--encre-douce)}
.tampon{position:absolute;right:0;top:0;transform:rotate(-7deg);color:var(--tampon);border:3px double var(--tampon);border-radius:6px;
  padding:6px 14px 4px;font-family:var(--f-titre);font-weight:800;font-stretch:115%;font-size:1.05rem;letter-spacing:.08em;line-height:1.15;text-align:center;
  background:color-mix(in srgb,var(--papier) 70%,transparent)}
.tampon small{display:block;font-size:.7rem;letter-spacing:.14em;font-weight:700}
@media (prefers-reduced-motion:no-preference){
  .remplissage{animation:remplir 1.1s cubic-bezier(.6,.1,.3,1) .2s both}
  .tampon{animation:frapper .35s cubic-bezier(.2,1.6,.4,1) 1.3s both}
  @keyframes remplir{from{transform:scaleX(0)}}
  @keyframes frapper{from{transform:rotate(-14deg) scale(1.9);opacity:0}}
}
@media (max-width:760px){
  .regle{padding-top:0;margin-top:28px;display:grid;grid-template-columns:auto 1fr;gap:0 18px}
  .echelle{grid-row:1;width:2px;height:auto;background:var(--encre);border:0;position:relative}
  .remplissage{width:6px;height:100%;left:-2px;bottom:auto;top:0;transform-origin:top}
  @media (prefers-reduced-motion:no-preference){@keyframes remplir{from{transform:scaleY(0)}}}
  .jalons{height:auto;display:grid;gap:22px;grid-row:1}
  .jalons li,.jalons li:first-child,.jalons li:last-child{position:relative;left:0!important;transform:none;text-align:left;width:auto;padding-top:0}
  .jalons li::before,.jalons li:first-child::before,.jalons li:last-child::before{top:8px;left:-26px;right:auto;margin:0}
  .tampon{position:relative;grid-column:2;justify-self:start;margin-top:22px}
}

/* Extrait de règlement de consultation */
.deux{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:start}
@media (max-width:860px){.deux{grid-template-columns:minmax(0,1fr)}}
.extrait{background:var(--surface);border:1px solid var(--filet);border-radius:3px;padding:22px 24px;font-size:1rem;min-width:0}
.extrait .ref{font-family:var(--f-titre);font-stretch:90%;font-size:.9rem;color:var(--encre-douce);margin-bottom:10px}
.extrait table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.extrait td{padding:7px 0;border-bottom:1px solid var(--filet);vertical-align:top}
.extrait td:last-child{text-align:right;padding-left:12px;white-space:nowrap}
.extrait .sous td:first-child{padding-left:18px;color:var(--encre-douce)}
.extrait .total td{font-weight:600;border-bottom:2px solid var(--encre)}
.barre{display:flex;height:12px;margin-top:16px;border-radius:2px;overflow:hidden}
.barre i{display:block;background:var(--tampon)}.barre b{display:block;background:var(--filet);flex:1}

/* Livrables */
.livrables{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:0;border-top:1px solid var(--filet)}
.livrables li{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);gap:8px 32px;padding-block:18px;border-bottom:1px solid var(--filet)}
@media (max-width:640px){.livrables li{grid-template-columns:minmax(0,1fr)}}
.livrables h3{font-size:1.1rem}
.exemples{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}

/* Rien d'inventé */
mark{background:var(--surligneur);color:var(--sur-surligneur);padding:1px 4px;border-radius:2px;font-family:var(--f-titre);font-stretch:90%;font-size:.95em}
.citation{border-left:3px solid var(--tampon);padding:4px 0 4px 20px;font-style:italic}

/* Tarifs */
.tarifs{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;max-width:var(--colonne)}
.tarifs td{padding:16px 0;border-bottom:1px solid var(--filet);vertical-align:top}
.tarifs td:last-child{text-align:right;font-family:var(--f-titre);font-weight:750;font-stretch:95%;font-size:1.3rem;white-space:nowrap;padding-left:16px}
.tarifs small{display:block;color:var(--encre-douce);font-size:.95rem}
.table-wrap{overflow-x:auto}

/* Métiers */
.metiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}
@media (max-width:860px){.metiers{grid-template-columns:minmax(0,1fr)}}
.metiers > div{border-top:3px solid var(--encre);padding-top:16px;min-width:0}
.metiers ul{margin:10px 0 0;padding-left:1.1em;font-size:1rem;color:var(--encre-douce)}
.metiers li{margin-bottom:6px}

/* Questions */
details{border-bottom:1px solid var(--filet);max-width:var(--colonne)}
summary{cursor:pointer;padding-block:16px;font-family:var(--f-titre);font-stretch:90%;font-weight:650;font-size:1.15rem;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-weight:400;color:var(--tampon)}
details[open] summary::after{content:"−"}
details p{padding-bottom:18px}

/* Contact */
.contact{background:var(--encre);color:var(--papier);border-radius:4px;padding:clamp(28px,5vw,56px)}
.contact .doux{color:color-mix(in srgb,var(--papier) 75%,var(--encre))}
.contact .bouton.plein{background:var(--papier);color:var(--encre);border-color:var(--papier)}
.contact .bouton.plein:hover{background:var(--tampon);color:#fff;border-color:var(--tampon)}
.coord{display:flex;flex-wrap:wrap;gap:8px 28px;font-family:var(--f-titre);font-stretch:90%;font-size:1.1rem}
.coord span{user-select:all}
footer{padding-block:28px 40px;font-size:.92rem;color:var(--encre-douce);display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between}
footer nav{display:flex;flex-wrap:wrap;gap:10px 20px}

/* Conversion */
.bouton.petit{min-height:40px;padding:6px 14px;font-size:.95rem}
.rassure{font-size:.98rem;color:var(--encre-douce)}
.rassure a{display:inline-block;padding-block:10px;margin-block:-10px}
.evitement{position:absolute;left:-999px;top:8px;background:var(--encre);color:var(--papier);padding:10px 16px;border-radius:4px;z-index:10}
.evitement:focus{left:16px}
.garanties{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:10px 28px;font-size:1rem}
.garanties li{padding-left:22px;position:relative;max-width:20rem}
.garanties li::before{content:"";position:absolute;left:0;top:.5em;width:10px;height:10px;border:2px solid var(--tampon);border-radius:50%}
.exclusif h2{max-width:18ch}
.etapes-bloc{background:var(--surface);border:1px solid var(--filet);border-radius:3px;padding:22px 24px}
.etapes{margin:0;padding-left:1.4em;display:grid;gap:12px;font-size:1rem}
.etapes li::marker{font-family:var(--f-titre);font-weight:800;color:var(--tampon)}
.repere{border-left:3px solid var(--tampon);padding-left:16px}
.tarifs tr.courant td{font-weight:600}
.collant{display:none}
@media (max-width:760px){
  .entete .bouton.petit{font-size:.88rem;padding:6px 10px}
  .collant{display:block;position:sticky;bottom:0;z-index:5;margin:0 -16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
    background:color-mix(in srgb,var(--papier) 92%,transparent);border-top:1px solid var(--filet);backdrop-filter:blur(6px)}
  .collant .bouton{width:100%;justify-content:center}
}

.demande{display:grid;gap:14px;max-width:34rem;margin-top:8px}
.demande label{display:grid;gap:6px;font-family:var(--f-titre);font-stretch:92%;font-weight:600;font-size:1rem}
.demande label i{font-style:normal;font-weight:400;opacity:.8}
.demande input{font:1rem/1.4 var(--f-texte);padding:12px 14px;min-height:48px;border-radius:4px;border:2px solid transparent;background:var(--papier);color:var(--encre)}
.demande input:focus-visible{outline:3px solid var(--tampon);outline-offset:2px}
.demande input:user-invalid{border-color:#E5484D}
.demande .bouton{justify-self:start;cursor:pointer}
.demande .mention{font-size:.9rem;color:color-mix(in srgb,var(--papier) 75%,var(--encre))}
.demande .mention a{display:inline-block;padding-block:10px;margin-block:-10px}
.pot{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.contact .coord{margin-top:8px}

/* Pages de texte */
.texte{max-width:var(--colonne);padding-block:48px}
.texte h1{font-size:clamp(2rem,5vw,3rem);margin-bottom:24px}
.texte h2{font-size:1.25rem;margin:28px 0 8px;max-width:none}
.texte p{margin-bottom:10px}
</style></head><body><a class="evitement" href="#contenu">Aller au contenu</a><header class="entete cadre"><a class="marque" href="index.html">Pleine <span>Note</span></a><a class="bouton plein petit" href="index.html#demande">Pré-analyse offerte</a></header><main class="cadre" id="contenu"><article class="texte"><h1>Page introuvable</h1><p>Cette page n'existe pas ou plus.</p><p><a class="bouton plein" href="/">Retour à l'accueil</a></p></article></main><footer class="cadre"><span>Pleine Note, une marque d'AM DATA (SIREN 939 133 781), Paris</span><nav><a href="mentions-legales.html">Mentions légales</a><a href="cgv.html">Conditions générales</a><a href="index.html#questions">Questions</a></nav></footer></body></html>
